<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Lovers Responsive</title>
    <link rel="stylesheet" href="./css/mystyle.css">
</head>
<body>
    <header>
        <div class="top-bar"><h1>Puppy Lovers page.</h1></div>
    </header>

    <section class="banner">
        <img src="./images/banner-puppies.jpg" alt="">
    </section>

    <section class="puppies-wrapper">
        <div class="three-puppies-wrapper">
            <div class="puppyOne"><img src="./images/puppy-1.jpg" alt=""></div>
            <div class="missingPuppy">
                <p>Missing Puppy Here</p>
            </div>
            <div class="puppyTwo"><img src="./images/puppy-2.jpg" alt=""></div>
        </div>

        <div class="morePuppiesTittle">
            <h2>More Puppies</h2>
        </div>

        <div class="morePuppiesImage">
            <div><img src="./images/puppy-3.jpg" alt=""></div>
            <div><img src="./images/puppy-4.jpg" alt=""></div>
        </div>
    </section>

    <footer>
        <div class="footer-wrapper">
            <h2>Developed By: Jafar M.</h2>
        </div>
    </footer>
</body>
</html>
