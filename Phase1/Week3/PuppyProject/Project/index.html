<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <title>Puppy Lovers Page.</title>
  </head>
  <body>
    <header class="header bgBlue">
      <h1>Puppy Lovers Page</h1>
    </header>

    <section class="hero">
      <img src="./images/banner-puppies.jpg" alt="puppy images banner" />
    </section>

    <section class="mainContainer">
      <div class="container-wrapper">
        <div class="containerOne">
          <div>
            <img src="./images/puppy-1.jpg" alt="puppy-1" />
          </div>

          <div class="missingPuppy">
            <p>Puppy Missing Here!!</p>
          </div>
          <div>
            <img src="./images/puppy-2.jpg" alt="puppy-2" />
          </div>
        </div>

        <div class="morePuppies">
          <h2>More Puppies</h2>
        </div>

        <div class="containerTwo">
          <div>
            <img src="./images/puppy-3.jpg" alt="puppy-3" />
          </div>
          <div>
            <img src="./images/puppy-4.jpg" alt="puppy-4" />
          </div>
        </div>
      </div>
    </section>

    <footer class="bgBlue">
        <h2>Developed By: Jafar M.</h2>
    </footer>
  </body>
</html>
